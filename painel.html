<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#ffffff; --fg:#1c1b1f; --muted:#6b6872; --line:#e6e3ea; --card:#f6f5f8; --on:#e5392d; --ok:#239a4c; --off:#9a97a0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1b20; --fg:#ecebf0; --muted:#9c99a5; --line:#33313a; --card:#25242b; --on:#ff6b5e; --ok:#6fdc8c; --off:#7d7a85; }
  }
  * { box-sizing: border-box }
  body { margin:0; width:320px; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, "Segoe UI", sans-serif; padding:14px }
  h1 { font-size:15px; margin:0 0 10px }
  .linha { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer }
  .linha small { display:block; color:var(--muted); font-size:11px }
  .sw { appearance:none; width:38px; height:22px; border-radius:11px; background:var(--off); position:relative; cursor:pointer; flex:none; transition:background .15s }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s }
  .sw:checked { background:var(--ok) }
  .sw:checked::after { left:19px }
  #status { margin:12px 0 8px; background:var(--card); border-radius:8px; padding:10px }
  #titulo { font-weight:600; display:flex; align-items:center; gap:7px }
  #titulo i { width:9px; height:9px; border-radius:50%; background:var(--off); flex:none }
  #titulo.on i { background:var(--on) } #titulo.ok i { background:var(--ok) }
  #detalhes { color:var(--muted); font-size:12px; margin-top:6px; font-variant-numeric:tabular-nums }
  figure { margin:0 }
  #previa { display:block; width:100%; aspect-ratio:16/9; border-radius:6px; background:var(--card); object-fit:cover }
  figcaption { color:var(--muted); font-size:11px; margin-top:4px }
  .dica { color:var(--muted); font-size:11px; margin:10px 0 0 }
  kbd { font:11px ui-monospace, Consolas, monospace; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:0 4px }
</style>
</head>
<body>
  <h1>✂ Corta Anúncio em L</h1>
  <label class="linha"><span>Extensão ligada</span><input type="checkbox" id="ativo" class="sw"></label>
  <label class="linha"><span>Modo debug<small>quadrinho com status e prévia em cima do vídeo</small></span><input type="checkbox" id="debug" class="sw"></label>

  <section id="status">
    <div id="titulo"><i></i><span id="titulo-txt">verificando esta aba…</span></div>
    <div id="detalhes"></div>
  </section>

  <figure id="fig" hidden>
    <img id="previa" alt="Quadro atual do vídeo sem corte">
    <figcaption id="legenda">Como está o quadro sem o corte</figcaption>
  </figure>

  <p class="dica">Atalho pra ligar/desligar: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd></p>
  <script src="painel.js"></script>
</body>
</html>
